name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Expand bootstrapped source archive
        shell: bash
        run: |
          if compgen -G "source/melodio-project.zip.b64.part*" > /dev/null; then
            cat source/melodio-project.zip.b64.part* > /tmp/melodio-project.zip.b64
            base64 -d /tmp/melodio-project.zip.b64 > /tmp/melodio-project.zip
            unzip -o /tmp/melodio-project.zip -d .
            rm -rf source
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: expand Melodio Android source [skip ci]" || true
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew build_debug.sh tools/self_check.py
          ./build_debug.sh

      - uses: actions/upload-artifact@v4
        with:
          name: melodio-debug
          path: dist/melodio-debug.apk
          if-no-files-found: error
